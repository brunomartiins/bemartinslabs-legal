<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Meant</title>
    <meta name="description" content="Meant — affirmations for the person you’re becoming." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Geist:wght@400;500&display=swap" rel="stylesheet" />
    <style>
      :root { color-scheme: dark; --canvas: #1c1b20; --ink: #f2eee6; --muted: #a9a5ae; --accent: #c9b8e0; --rule: #34323a; }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--canvas); color: var(--ink); font: 17px/1.65 Geist, -apple-system, system-ui, sans-serif; }
      main { max-width: 680px; margin: 0 auto; padding: 56px 20px 72px; }
      nav { display: flex; gap: 20px; flex-wrap: wrap; margin-bottom: 48px; font-size: 15px; }
      nav .brand { font-family: "Instrument Serif", Georgia, serif; font-size: 26px; line-height: 1; margin-right: auto; color: var(--ink); text-decoration: none; }
      nav a { color: var(--muted); text-decoration: none; }
      nav a[aria-current] { color: var(--ink); }
      h1, h2 { font-family: "Instrument Serif", Georgia, serif; font-weight: 400; line-height: 1.15; }
      h1 { font-size: 44px; margin: 0 0 8px; }
      h2 { font-size: 26px; margin: 40px 0 8px; }
      p, li { color: var(--ink); }
      ul { padding-left: 20px; }
      a { color: var(--accent); }
      .updated { color: var(--muted); font-size: 15px; margin-bottom: 32px; }
      footer { margin-top: 56px; padding-top: 20px; border-top: 1px solid var(--rule); color: var(--muted); font-size: 14px; }
    </style>
  </head>
  <body>
    <main>
      <nav>
        <a class="brand" href="./">Meant</a>
        <a href="privacy.html">Privacy</a>
        <a href="terms.html">Terms</a>
        <a href="support.html">Support</a>
      </nav>
      <h1>Meant</h1>
      <p>Affirmations for the person you’re becoming.</p>
      <ul>
        <li><a href="privacy.html">Privacy Policy</a></li>
        <li><a href="terms.html">Terms of Use</a></li>
        <li><a href="support.html">Support</a></li>
      </ul>
      <footer>Meant is an affirmations app for iPhone. Apple and App Store are trademarks of Apple Inc.</footer>
    </main>
  </body>
</html>
